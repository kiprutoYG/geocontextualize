services:
  backend:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    volumes:
      - .cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  frontend:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://127.0.0.1:8001}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  .cache:
