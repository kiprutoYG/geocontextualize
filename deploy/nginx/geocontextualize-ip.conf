# Direct-IP HTTPS site. Requires a current Let's Encrypt IP certificate at the
# paths below. A normal hostname is preferable for a durable public service.
server {
    listen 80;
    listen [::]:80;
    server_name 209.38.197.161;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/geocontextualize-acme;
        default_type "text/plain";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 209.38.197.161;

    ssl_certificate /etc/letsencrypt/live/209.38.197.161/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/209.38.197.161/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 512k;

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        limit_req zone=geocontextualize_api burst=10 nodelay;
        limit_conn geocontextualize_per_ip 4;
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
