# Direct-IP HTTPS site. Requires a current Let's Encrypt IP certificate at the
# paths below. A normal hostname is preferable for a durable public service.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 209.38.197.161;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/geocontextualize-acme;
        default_type "text/plain";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    # Literal IP clients do not reliably send a usable TLS SNI name, so this
    # must be the default TLS virtual host. GAUL remains selected by its name.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 209.38.197.161;

    ssl_certificate /etc/letsencrypt/live/209.38.197.161/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/209.38.197.161/privkey.pem;
    # Certbot's webroot flow does not install its optional Nginx snippet.
    # Keep the required modern TLS settings self-contained instead.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GeoContextualizeSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 512k;

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        limit_req zone=geocontextualize_api burst=10 nodelay;
        limit_conn geocontextualize_per_ip 4;
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
