# Bootstrap site for direct-IP certificate issuance. Install this first, then
# replace it with geocontextualize-ip.conf after Certbot creates the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name 209.38.197.161;

    client_max_body_size 512k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/geocontextualize-acme;
        default_type "text/plain";
    }

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        limit_req zone=geocontextualize_api burst=10 nodelay;
        limit_conn geocontextualize_per_ip 4;
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
